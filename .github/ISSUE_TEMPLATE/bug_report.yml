name: Bug report
description: Something went wrong with a translation, a transcription or the app itself.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. The two files below let us see what the run did without asking you to describe it.
        Both are saved next to the subtitle, and both leave out your API keys. Please check that nothing private is left in them before you attach them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: run-record
    attributes:
      label: Run record (.run.jsonl)
      description: |
        Attach the run's `.run.jsonl` file first. It has the same name as the subtitle, ending in `.run.jsonl`.
        It is a step-by-step record of the run: its settings, progress, warnings and how it ended. It does not contain your subtitles, your description or your API keys.
      placeholder: Drag the .run.jsonl file here.
    validations:
      required: false
  - type: textarea
    id: console-log
    attributes:
      label: Console log (.console.log)
      description: |
        Then attach the run's `.console.log` file, which has the same name ending in `.console.log`. It is what the run said, line by line.
        It can include the description you gave the run, so read it through before attaching it.
      placeholder: Drag the .console.log file here.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11
    validations:
      required: false
